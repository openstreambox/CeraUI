name: Fork development artifacts

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile
      - name: Prepare packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev build-essential jq
          sudo gem install --no-document fpm -v 1.17.0
      - run: bun run lint
      - run: bun run check:tech-debt
      - run: bun test scripts/ci/fork-build.test.mjs
      - name: Prepare backend runtime
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo install -d -o "$(id -u)" -g "$(id -g)" /run/ceralive /var/run/bcrpt
          mkdir -p .ci-runtime
          curl --fail --location --silent --show-error -o .ci-runtime/srtla.deb \
            https://github.com/CERALIVE/srtla-send-rs/releases/download/v4.1.0/srtla_4.1.0_amd64.deb
          echo '496217e93cde36eeac0bde1b742c21fed6347a198f05a8cd898be116946b1eb8  .ci-runtime/srtla.deb' | sha256sum --check
          test "$(dpkg-deb --field .ci-runtime/srtla.deb Package)" = srtla
          test "$(dpkg-deb --field .ci-runtime/srtla.deb Version)" = 4.1.0
          test "$(dpkg-deb --field .ci-runtime/srtla.deb Architecture)" = amd64
          dpkg-deb --extract .ci-runtime/srtla.deb .ci-runtime/root
          chmod +x .ci-runtime/root/usr/bin/srtla_send
          echo "SRTLA_SEND_BIN=$PWD/.ci-runtime/root/usr/bin/srtla_send" >> "$GITHUB_ENV"
      - run: bun run test
      - run: bun run test:release-package-contracts

  # Browser cases that must run, never skip: the preview's real WebCodecs H.264
  # decode and the bond-toggle reconnect harness against the mock backend. The
  # upstream E2E lanes run only for pull requests to main, so this is where the
  # fork's integration branches exercise them. CI is unset so Playwright starts
  # its own dev server and reference backend (the local shape).
  browser-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: |
          bun run --filter frontend test:e2e:install-deps
          bun run --filter frontend test:e2e:install-browser
      - run: bun run --filter @ceraui/i18n generate:i18n
      # The backend refuses to boot without a sender binary, even on mocks. The
      # mock backend never streams, so point it at the checkout's mock sender
      # and keep its IP list file out of /run.
      - name: Use the mock sender
        run: |
          SRTLA_DIR="$PWD/apps/backend/mocks/srtla" IPS_FILE="$RUNNER_TEMP/srtla_ips" bun -e '
            const path = "apps/backend/setup.json";
            const setup = await Bun.file(path).json();
            setup.srtla_path = process.env.SRTLA_DIR;
            setup.ips_file = process.env.IPS_FILE;
            await Bun.write(path, JSON.stringify(setup, null, 2) + "\n");
          '
          test -x apps/backend/mocks/srtla/srtla_send
      - name: Focused browser cases
        run: |
          set -euo pipefail
          mkdir -p apps/frontend/test-results
          # pw:webserver shows the dev server and backend output when one fails to start.
          env -u CI E2E_PASSWORD=12345678 DEBUG=pw:webserver \
            PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/apps/frontend/test-results/focused.json" \
            bun run --filter frontend test:e2e -- --project=desktop --retries=0 --forbid-only \
            --grep-invert "@visual|@a11y|@gallery|@premigration-upgrade" --reporter=line,json \
            tests/e2e/preview.spec.ts tests/e2e/bond-toggle-reconnect.spec.ts
          # A skip, or a case that silently left the selection, would hide exactly
          # what this job exists to run.
          jq -e --argjson required '["WebCodecs tier decodes the mock preview server to a live canvas","a link leaves the bond, survives a reconnect, ignores the replaced socket and rejoins","a configure reply lost in a reconnect: the toggle converges to what the backend applied"]' '
            .stats.expected == 6 and .stats.skipped == 0 and .stats.unexpected == 0 and .stats.flaky == 0
            and ([.. | objects | select(has("specs")) | .specs[] | select(.ok) | .title] as $passed
              | all($required[]; . as $t | $passed | index($t)))' \
            apps/frontend/test-results/focused.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-focused-results
          path: apps/frontend/test-results/
          if-no-files-found: ignore

  artifacts:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile
      - name: Build and package development payload
        env:
          BUILD_ARCH: ${{ matrix.architecture }}
        run: scripts/fork/package.sh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ceraui-${{ matrix.architecture }}
          path: artifacts/
          if-no-files-found: error
